name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download Hollow Knight references and Modding API
        uses: BadMagic100/setup-hk@v1
        with:
          apiPath: API/

      - name: Build
        run: dotnet build WitchKnight/WitchKnight.csproj -c Release -p:HollowKnightRefs="$GITHUB_WORKSPACE/API"

      - name: Package
        run: |
          mkdir -p dist/WitchKnight
          cp WitchKnight/bin/Release/net472/WitchKnight.dll WitchKnight/bin/Release/net472/WitchKnight.pdb dist/WitchKnight/
          cp README.md LICENSE dist/WitchKnight/
          (cd dist && zip -r WitchKnight.zip WitchKnight)
          sha256sum dist/WitchKnight.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WitchKnight
          path: dist/WitchKnight.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/WitchKnight.zip --generate-notes
